[project]
name = "drague"
version = "0.0.1"
description = "League training vs self-play vs PFSP for multi-drone tracking teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "crazyflow",          # brings in jax; pin the exact version after the week-1 spike passes
]

[project.optional-dependencies]
gpu = ["crazyflow[gpu]"]  # Linux x86-64 + CUDA 12 only (Empire AI, Colab). Macs use the CPU build.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drague"]

[tool.pytest.ini_options]
testpaths = ["tests"]
