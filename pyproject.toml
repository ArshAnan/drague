[project]
name = "drague"
version = "0.0.1"
description = "League training vs self-play vs PFSP for multi-drone tracking teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "crazyflow==0.3.2",   # brings in jax; pinned to the version the week-1 spike ran on
]

[project.optional-dependencies]
gpu = ["crazyflow[gpu]==0.3.2"]  # Linux x86-64 + CUDA 12 only (Empire AI, Colab). Macs use the CPU build.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drague"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # import drague even if the editable install's .pth is skipped
